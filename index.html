<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title><style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#ff758c,#ff7eb3,#ffb199);
    background-size:400% 400%;
    animation: gradient 10s ease infinite;
    text-align:center;
    color:white;
    overflow:hidden;
}

@keyframes gradient {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

h1{ margin-top:30px; font-size:42px; }

.cakes{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
    margin-top:40px;
}

.cake{ position:relative; width:250px; }

.layer{ height:70px; border-radius:15px; margin-bottom:8px; }
.layer1{ background:#ffccd5; }
.layer2{ background:#ffb3c1; }
.layer3{ background:#ff8fab; }

.candle{
    width:14px;
    height:50px;
    background:white;
    position:absolute;
    top:-50px;
    left:50%;
    transform:translateX(-50%);
    border-radius:4px;
}

.flame{
    width:16px;
    height:25px;
    background:orange;
    border-radius:50%;
    position:absolute;
    top:-25px;
    left:50%;
    transform:translateX(-50%);
    animation:flicker 0.3s infinite alternate;
}

@keyframes flicker{
    from{ transform:translateX(-50%) scale(1); opacity:1; }
    to{ transform:translateX(-50%) scale(1.2); opacity:0.7; }
}

button{
    margin-top:40px;
    padding:14px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4b5c;
    cursor:pointer;
}

button:hover{ background:#ffe6ea; }

/* Confetti */
.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:0;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(100vh) rotate(720deg);
        opacity:0;
    }
}

.heart{
    position:fixed;
    top:-10px;
    font-size:20px;
    animation:fall linear forwards;
}

</style></head>
<body><h1>Happy Birthday My Queen 👑❤️</h1><div class="cakes"><div class="cake">
    <div class="candle"><div class="flame"></div></div>
    <div class="layer layer1"></div>
    <div class="layer layer2"></div>
    <div class="layer layer3"></div>
</div>

<div class="cake">
    <div class="candle"><div class="flame"></div></div>
    <div class="layer layer3"></div>
    <div class="layer layer1"></div>
    <div class="layer layer2"></div>
</div>

<div class="cake">
    <div class="candle"><div class="flame"></div></div>
    <div class="layer layer2"></div>
    <div class="layer layer3"></div>
    <div class="layer layer1"></div>
</div>

</div><button onclick="celebrate()">Blow All Candles 🎂✨</button>

<script>
function celebrate(){
    document.querySelectorAll('.flame').forEach(f=>f.style.display='none');
    launchConfetti();
    alert("Happy Birthday My Love ❤️✨ Make a Big Wish!");
}

function launchConfetti(){
    const colors=['#ff0','#ff4b5c','#00f','#0f0','#fff','#ffa500'];
    for(let i=0;i<150;i++){
        const conf=document.createElement('div');
        conf.classList.add('confetti');
        conf.style.left=Math.random()*100+'vw';
        conf.style.background=colors[Math.floor(Math.random()*colors.length)];
        conf.style.animationDuration=(Math.random()*3+2)+'s';
        document.body.appendChild(conf);
        setTimeout(()=>conf.remove(),5000);
    }
}

function createHeart(){
    const heart=document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML='❤️';
    heart.style.left=Math.random()*100+'vw';
    heart.style.animationDuration=(Math.random()*3+2)+'s';
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,400);
</script></body>
</html>
