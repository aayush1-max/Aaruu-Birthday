<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dubai Birthday Surprise ❤️</title><style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: url('https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    background-position:center;
    text-align:center;
    color:white;
    overflow:hidden;
}

body::after{
    content:"";
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    z-index:-1;
}

h1{ margin-top:40px; font-size:45px; }
h2{ font-weight:normal; }

button{
    margin-top:40px;
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:gold;
    color:black;
    cursor:pointer;
}

button:hover{ background:orange; }

.firework{
    position:fixed;
    width:6px;
    height:6px;
    border-radius:50%;
}

@keyframes explode{
    to{
        transform:translate(var(--x), var(--y));
        opacity:0;
    }
}

</style></head>
<body><h1>Happy Birthday My Queen 👑❤️</h1>
<h2>Even Dubai is shining for you tonight ✨🌆</h2><button onclick="celebrate()">Celebrate in Dubai 🎆</button>

<script>
function celebrate(){
    launchFireworks();
    alert("One day we will celebrate your birthday in Dubai together ❤️✨");
}

function launchFireworks(){
    for(let i=0;i<5;i++){
        setTimeout(()=>{
            createExplosion(Math.random()*window.innerWidth, Math.random()*window.innerHeight/2);
        }, i*800);
    }
}

function createExplosion(x,y){
    const colors=['#ff0','#ff4b5c','#00f','#0f0','#fff','#ffa500','gold'];
    for(let i=0;i<40;i++){
        const particle=document.createElement('div');
        particle.classList.add('firework');
        particle.style.background=colors[Math.floor(Math.random()*colors.length)];
        particle.style.left=x+'px';
        particle.style.top=y+'px';
        const angle=Math.random()*2*Math.PI;
        const distance=Math.random()*150+50;
        const xMove=Math.cos(angle)*distance+'px';
        const yMove=Math.sin(angle)*distance+'px';
        particle.style.setProperty('--x',xMove);
        particle.style.setProperty('--y',yMove);
        particle.style.animation='explode 1s forwards';
        document.body.appendChild(particle);
        setTimeout(()=>particle.remove(),1000);
    }
}
</script></body>
</html>
