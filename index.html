<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title><style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background: linear-gradient(135deg,#ff758c,#ff7eb3,#ffb199);
    text-align:center;
    color:white;
    overflow:hidden;
}

h1{ margin-top:40px; font-size:42px; }

.cake{
    position:relative;
    width:300px;
    margin:60px auto;
}

.layer{
    height:80px;
    border-radius:20px;
    margin-bottom:10px;
}
.layer1{ background:#ffccd5; }
.layer2{ background:#ff8fab; }
.layer3{ background:#ff4d6d; }

.candle{
    width:18px;
    height:60px;
    background:white;
    position:absolute;
    top:-60px;
    left:50%;
    transform:translateX(-50%);
    border-radius:5px;
}

.flame{
    width:18px;
    height:30px;
    background:orange;
    border-radius:50%;
    position:absolute;
    top:-30px;
    left:50%;
    transform:translateX(-50%);
    animation:flicker 0.3s infinite alternate;
}

@keyframes flicker{
    from{ transform:translateX(-50%) scale(1); opacity:1; }
    to{ transform:translateX(-50%) scale(1.2); opacity:0.7; }
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:gold;
    color:black;
    cursor:pointer;
}
button:hover{ background:orange; }

.firework{
    position:fixed;
    width:6px;
    height:6px;
    border-radius:50%;
}

@keyframes explode{
    to{
        transform:translate(var(--x), var(--y));
        opacity:0;
    }
}

</style></head>
<body><h1>Happy Birthday My Love ❤️</h1><div class="cake">
    <div class="candle"><div class="flame"></div></div>
    <div class="layer layer1"></div>
    <div class="layer layer2"></div>
    <div class="layer layer3"></div>
</div><button onclick="celebrate()">Blow Candle & Celebrate 🎂✨</button>

<script>
function celebrate(){
    document.querySelector('.flame').style.display='none';
    launchFireworks();
    alert("Happy Birthday My Love ❤️✨");
}

function launchFireworks(){
    for(let i=0;i<5;i++){
        setTimeout(()=>{
            createExplosion(Math.random()*window.innerWidth, Math.random()*window.innerHeight/2);
        }, i*700);
    }
}

function createExplosion(x,y){
    const colors=['#ff0','#ff4b5c','#00f','#0f0','#fff','#ffa500','pink'];
    for(let i=0;i<40;i++){
        const particle=document.createElement('div');
        particle.classList.add('firework');
        particle.style.background=colors[Math.floor(Math.random()*colors.length)];
        particle.style.left=x+'px';
        particle.style.top=y+'px';
        const angle=Math.random()*2*Math.PI;
        const distance=Math.random()*150+50;
        const xMove=Math.cos(angle)*distance+'px';
        const yMove=Math.sin(angle)*distance+'px';
        particle.style.setProperty('--x',xMove);
        particle.style.setProperty('--y',yMove);
        particle.style.animation='explode 1s forwards';
        document.body.appendChild(particle);
        setTimeout(()=>particle.remove(),1000);
    }
}
</script></body>
</html>
