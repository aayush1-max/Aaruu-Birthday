<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title><style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#ff758c,#ff7eb3,#ffb199);
    background-size:400% 400%;
    animation: gradient 10s ease infinite;
    text-align:center;
    color:white;
    overflow-x:hidden;
}

@keyframes gradient {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

h1{
    margin-top:30px;
    font-size:42px;
}

p{
    width:85%;
    margin:auto;
    font-size:18px;
    line-height:1.6;
}

/* Cake Design */
.cake{
    position:relative;
    margin:40px auto;
    width:200px;
}

.layer{
    height:60px;
    background:#ffccd5;
    border-radius:10px;
    margin-bottom:5px;
}

.layer:nth-child(2){ background:#ffb3c1; }
.layer:nth-child(3){ background:#ff8fab; }

.candle{
    width:10px;
    height:40px;
    background:white;
    position:absolute;
    top:-40px;
    left:50%;
    transform:translateX(-50%);
    border-radius:3px;
}

.flame{
    width:12px;
    height:20px;
    background:orange;
    border-radius:50%;
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    animation:flicker 0.3s infinite alternate;
}

@keyframes flicker{
    from{ transform:translateX(-50%) scale(1); opacity:1; }
    to{ transform:translateX(-50%) scale(1.2); opacity:0.7; }
}

.slideshow{
    margin-top:30px;
    position:relative;
    height:320px;
}

.slideshow img{
    width:260px;
    height:320px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    opacity:0;
    transition:opacity 1s;
}

button{
    margin-top:30px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:25px;
    background:white;
    color:#ff4b5c;
    cursor:pointer;
}

button:hover{
    background:#ffe6ea;
}

.heart{
    position:fixed;
    top:-10px;
    font-size:20px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(100vh);
        opacity:0;
    }
}

.footer{
    margin-top:40px;
    padding-bottom:30px;
    font-size:14px;
    opacity:0.8;
}

</style></head>
<body><h1>Happy Birthday My Queen 👑❤️</h1><div class="cake">
    <div class="candle">
        <div class="flame"></div>
    </div>
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="layer"></div>
</div><p>
You are the sweetest part of my life. 
Like this cake, may your life be full of sweetness and happiness. 🎂💕
</p><div class="slideshow">
    <img src="photo1.jpg" class="slide">
    <img src="photo2.jpg" class="slide">
    <img src="photo3.jpg" class="slide">
</div><button onclick="blowCandle()">Blow The Candle 🎂✨</button>

<div class="footer">
Made with endless love ❤️ by Your Love
</div><audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio><script>

// Slideshow
let slides=document.querySelectorAll('.slide');
let index=0;

function showSlides(){
    slides.forEach(slide=>slide.style.opacity=0);
    slides[index].style.opacity=1;
    index=(index+1)%slides.length;
}
setInterval(showSlides,2000);
showSlides();

// Blow candle
function blowCandle(){
    document.querySelector('.flame').style.display='none';
    alert("Make a wish my love ❤️✨");
}

// Falling hearts
function createHeart(){
    const heart=document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML='❤️';
    heart.style.left=Math.random()*100+'vw';
    heart.style.animationDuration=(Math.random()*3+2)+'s';
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,300);

</script></body>
</html>
